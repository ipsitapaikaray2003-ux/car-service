<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" opacity="0.35">
  <defs>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.6"/>
    </linearGradient>
    <pattern id="techGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#60a5fa" stroke-width="0.5" stroke-dasharray="2 4"/>
      <circle cx="0" cy="0" r="1.5" fill="#38bdf8"/>
    </pattern>
  </defs>

  <!-- Technical Engineering Grid Background -->
  <rect width="100%" height="100%" fill="url(#techGrid)"/>

  <!-- Automotive Chassis & Precision Body Profile (Sports GT Blueprint) -->
  <g fill="none" stroke="url(#techGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Outer Aerodynamic Silhouette -->
    <path d="M 120 620 
             C 170 610, 240 600, 310 590
             C 340 520, 410 470, 490 470
             C 570 470, 640 520, 670 590
             C 850 595, 1020 595, 1180 590
             C 1210 520, 1280 470, 1360 470
             C 1440 470, 1510 520, 1540 590
             C 1580 595, 1610 605, 1630 620
             C 1630 560, 1590 510, 1520 480
             C 1470 460, 1370 440, 1260 410
             C 1120 310, 940 240, 780 240
             C 580 240, 420 310, 260 440
             C 170 490, 110 540, 100 580
             Z" stroke-width="3"/>

    <!-- Roofline & Glasshouse Canopy -->
    <path d="M 460 430
             C 560 330, 700 270, 840 270
             C 990 270, 1130 330, 1240 430
             L 1210 435
             C 1110 350, 980 300, 840 300
             C 710 300, 580 350, 490 435
             Z" stroke-width="2"/>

    <!-- B-Pillar & Window Partition -->
    <line x1="840" y1="275" x2="840" y2="435" stroke-width="2"/>
    <path d="M 500 425 C 600 355, 710 320, 825 320 L 825 430 Z" stroke-width="1.5"/>
    <path d="M 855 320 C 970 320, 1080 355, 1180 425 L 855 430 Z" stroke-width="1.5"/>

    <!-- Front Wheel Well & Technical Rim Disc -->
    <circle cx="490" cy="590" r="105" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="490" cy="590" r="82" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="6 3"/>
    <circle cx="490" cy="590" r="45" stroke="#ef4444" stroke-width="2"/>
    <circle cx="490" cy="590" r="18" fill="#38bdf8"/>
    <!-- Wheel spokes -->
    <line x1="490" y1="508" x2="490" y2="672" stroke="#60a5fa" stroke-width="2"/>
    <line x1="408" y1="590" x2="572" y2="590" stroke="#60a5fa" stroke-width="2"/>
    <line x1="432" y1="532" x2="548" y2="648" stroke="#60a5fa" stroke-width="2"/>
    <line x1="432" y1="648" x2="548" y2="532" stroke="#60a5fa" stroke-width="2"/>

    <!-- Rear Wheel Well & Technical Rim Disc -->
    <circle cx="1360" cy="590" r="105" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="1360" cy="590" r="82" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="6 3"/>
    <circle cx="1360" cy="590" r="45" stroke="#ef4444" stroke-width="2"/>
    <circle cx="1360" cy="590" r="18" fill="#38bdf8"/>
    <!-- Wheel spokes -->
    <line x1="1360" y1="508" x2="1360" y2="672" stroke="#60a5fa" stroke-width="2"/>
    <line x1="1278" y1="590" x2="1442" y2="590" stroke="#60a5fa" stroke-width="2"/>
    <line x1="1302" y1="532" x2="1418" y2="648" stroke="#60a5fa" stroke-width="2"/>
    <line x1="1302" y1="648" x2="1418" y2="532" stroke="#60a5fa" stroke-width="2"/>

    <!-- Aerodynamic Headlamp & Taillamp Accents -->
    <path d="M 120 530 Q 180 520 220 500" stroke="#ef4444" stroke-width="3"/>
    <path d="M 1530 500 Q 1580 520 1620 535" stroke="#38bdf8" stroke-width="3"/>

    <!-- Door Body Line & Aerodynamic Side Air-Curtain -->
    <path d="M 590 530 L 1260 530" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 680 470 C 780 470, 920 480, 1020 550" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Technical Calibration Measurement Lines & Crosshairs -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.65">
    <!-- Wheelbase dimension line -->
    <line x1="490" y1="740" x2="1360" y2="740" stroke-dasharray="8 4"/>
    <line x1="490" y1="720" x2="490" y2="760"/>
    <line x1="1360" y1="720" x2="1360" y2="760"/>
    <text x="925" y="732" fill="#38bdf8" font-family="monospace" font-size="14" text-anchor="middle" letter-spacing="3">WHEELBASE: 2850 MM</text>

    <!-- Overall Length dimension line -->
    <line x1="100" y1="180" x2="1630" y2="180" stroke-dasharray="8 4"/>
    <line x1="100" y1="165" x2="100" y2="195"/>
    <line x1="1630" y1="165" x2="1630" y2="195"/>
    <text x="865" y="172" fill="#38bdf8" font-family="monospace" font-size="14" text-anchor="middle" letter-spacing="4">PRECISION CHASSIS CAD: OVERALL 4950 MM</text>

    <!-- Calibration Crosshairs -->
    <g transform="translate(200, 240)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#38bdf8"/>
      <line x1="-20" y1="0" x2="20" y2="0"/>
      <line x1="0" y1="-20" x2="0" y2="20"/>
      <text x="25" y="5" fill="#38bdf8" font-family="monospace" font-size="11">POINT: 01-FRONT-AERO</text>
    </g>

    <g transform="translate(1420, 240)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#ef4444"/>
      <line x1="-20" y1="0" x2="20" y2="0" stroke="#ef4444"/>
      <line x1="0" y1="-20" x2="0" y2="20" stroke="#ef4444"/>
      <text x="-165" y="5" fill="#ef4444" font-family="monospace" font-size="11">POINT: 02-DIFFUSER-REAR</text>
    </g>
  </g>
</svg>
